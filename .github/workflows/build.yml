# Build the MotoMoto Runner image and push it to GHCR.
# Triggers on a version tag (v*) or manual dispatch. The image is large (bundles
# torch + the model repos), so a full build can take a while.
name: build-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        default: "latest"
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk — the runner image (torch + CUDA + model repos) is big and the
      # default GitHub runner has limited free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag
        id: t
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ github.event.inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sweetlhare/momoto-runner:${{ steps.t.outputs.tag }}
            ghcr.io/sweetlhare/momoto-runner:latest
